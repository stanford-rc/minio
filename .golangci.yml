version: "2"
linters:
  default: none
  enable:
    - durationcheck
    - forcetypeassert
    - gocritic
    # ELM 2026-09-09. Was "gomodguard", deprecated in golangci-lint v2.12.0.
    # The rename is safe here only because no gomodguard settings block exists.
    # The two are NOT config-compatible, and a v1-shaped block under the v2 key
    # is silently ignored rather than rejected. Verified against v2.13.2: the
    # same blocked-module rule fired under "gomodguard" and reported nothing
    # under "gomodguard_v2" until rewritten to the v2 shape.
    #
    #   v1:  blocked:              v2:  blocked:
    #          modules:                   - module: github.com/foo/bar
    #            - github.com/foo/bar:      reason: "..."
    #                reason: "..."
    #
    # "allowed" changed shape too, and local-replace-directives moved from
    # under "blocked" to the top level of the settings block.
    - gomodguard_v2
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    - usetesting
    - whitespace
  settings:
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -SA1008
        - -SA1019
        - -SA4000
        - -SA9004
        - -ST1000
        - -ST1005
        - -ST1016
        - -U1000
  exclusions:
    generated: lax
    rules:
      - linters:
          - forcetypeassert
        path: _test\.go
      - path: (.+)\.go$
        text: 'empty-block:'
      - path: (.+)\.go$
        text: 'unused-parameter:'
      - path: (.+)\.go$
        text: 'dot-imports:'
      - path: (.+)\.go$
        text: should have a package comment
      - path: (.+)\.go$
        text: error strings should not be capitalized or end with punctuation or a newline
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 100
  max-same-issues: 100
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
